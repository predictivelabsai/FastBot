[project]
name = "fastbot"
version = "0.1.0"
description = "Governed AI coworkers with FastHTML, LangGraph, AG-UI, and xAI"
requires-python = ">=3.11"
dependencies = [
  "python-fasthtml>=0.12.0",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "playwright>=1.48", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "F403", "F405", "F811"]

[project.scripts]
fastbot = "fastbot.main:run"

[tool.setuptools.packages.find]
include = ["fastbot*"]
